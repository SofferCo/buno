[functions.chat]
verify_jwt = true

# Google redirect can't carry a Supabase JWT — the user is proven via a
# service-key-HMAC state string instead (see the function).
[functions.google-oauth]
verify_jwt = false

[functions.calendar]
verify_jwt = true

[functions.gmail-scan]
verify_jwt = true

# invoked by pg_cron, not the browser — gated by the CRON_SECRET header.
[functions.morning-sweep]
verify_jwt = false

# on-demand sweep for the signed-in user (B4) — JWT-gated, rate-limited in code.
[functions.sweep-now]
verify_jwt = true
